name: 🐛 Bug Report
description: File a bug report to help us improve Jugaad
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: component
    attributes:
      label: Affected Component
      description: Which portal or module is affected?
      placeholder: "e.g., User Portal, Worker Radar, Admin Dashboard, Backend API"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open User Portal
        2. Tap on Electrician category
        3. See error
    validations:
      required: true
