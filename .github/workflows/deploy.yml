name: 🚀 Jugaad CI/CD Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_HOSTNAME: ${{ secrets.GCP_REGION }}-docker.pkg.dev
  GAR_REPO: jugaad
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # STAGE 1: Code Validation & Quality Checks
  # ============================================================================
  validate:
    name: 🔍 Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Backend Dependencies
        working-directory: apps/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Backend Syntax & Import Verification
        working-directory: apps/backend
        run: |
          python -c "import main; print('Backend monolith imports verified!')"

      - name: ⚛️ Set up Node.js for Admin Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/admin/package-lock.json

      - name: 🔨 Build Admin Dashboard
        working-directory: apps/admin
        run: |
          npm ci
          npm run build

  # ============================================================================
  # STAGE 2: Parallel Docker Build & Push to Google Artifact Registry
  # (Executes if GCP_SA_KEY secret is configured)
  # ============================================================================
  build-and-push:
    name: Build & Push (${{ matrix.service_name }})
    runs-on: ubuntu-latest
    needs: validate
    if: secrets.GCP_SA_KEY != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: user-service
            folder: user_service
          - service_name: auth-service
            folder: auth_service
          - service_name: booking-service
            folder: booking_service
          - service_name: worker-service
            folder: worker_service
          - service_name: payment-service
            folder: payment_service
          - service_name: notification-service
            folder: notification_service
          - service_name: review-service
            folder: review_service
          - service_name: matching-service
            folder: matching_service
          - service_name: admin-service
            folder: admin_service

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ☁️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 🐳 Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_HOSTNAME }} --quiet

      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/services/${{ matrix.folder }}/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ matrix.service_name }}:latest
            ${{ env.GAR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ matrix.service_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service_name }}

  # ============================================================================
  # STAGE 3: Parallel Deploy to Google Cloud Run
  # ============================================================================
  deploy:
    name: 🚀 Deploy (${{ matrix.service_name }})
    runs-on: ubuntu-latest
    needs: build-and-push
    if: secrets.GCP_SA_KEY != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - service_name: user-service
            folder: user_service
            port: 8001
          - service_name: auth-service
            folder: auth_service
            port: 8002
          - service_name: booking-service
            folder: booking_service
            port: 8003
          - service_name: worker-service
            folder: worker_service
            port: 8004
          - service_name: payment-service
            folder: payment_service
            port: 8005
          - service_name: notification-service
            folder: notification_service
            port: 8006
          - service_name: review-service
            folder: review_service
            port: 8007
          - service_name: matching-service
            folder: matching_service
            port: 8008
          - service_name: admin-service
            folder: admin_service
            port: 8009

    steps:
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🚀 Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: jugaad-${{ matrix.service_name }}
          image: ${{ env.GAR_HOSTNAME }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ matrix.service_name }}:${{ github.sha }}
          region: ${{ env.GCP_REGION }}
          flags: |
            --port=${{ matrix.port }}
            --allow-unauthenticated
            --min-instances=1
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --timeout=300s
            --liveness-probe-path=/health
            --liveness-probe-failure-threshold=3

  # ============================================================================
  # STAGE 4: Run Summary and Diagnostics
  # ============================================================================
  summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [validate, build-and-push, deploy]
    if: always()

    steps:
      - name: ✅ Post Summary
        run: |
          echo "## 🚀 Jugaad CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate.result }}" == "success" ]; then
            echo "### ✅ Code validation & builds passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Code validation failed." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ secrets.GCP_SA_KEY }}" == "" ]; then
            echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
            echo "> **GCP Deployment Skipped**: \`GCP_SA_KEY\` secret is not yet configured in GitHub repository secrets. Add \`GCP_SA_KEY\`, \`GCP_PROJECT_ID\`, and \`GCP_REGION\` to enable automated Cloud Run deployments." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "### 🚀 All 9 microservices deployed to Cloud Run successfully!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
