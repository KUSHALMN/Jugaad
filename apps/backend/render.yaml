  # ─── NOTE: outbox_publisher is DELETED ────────────────────────────────────
  # Replaced by Postgres trigger + pg_net HTTP extension
  # See: supabase/schema.sql → outbox_event_trigger

# ─── Shared Environment Variable Group ──────────────────────────────────────
# Create this group in Render Dashboard → Environment Groups
# All services reference it via `fromGroup: jugaad-shared-env`
envVarGroups:
  - name: jugaad-shared-env
    envVars:
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Service-to-service auth
      - key: INTERNAL_SECRET
        generateValue: true
      # Firebase Admin SDK (Auth + FCM — DO NOT REMOVE)
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      # For Render: paste full JSON content of firebase-credentials.json here
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # Upstash (FREE — KEEP)
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Razorpay (KEEP)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # MSG91 SMS (KEEP)
      - key: MSG91_API_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      # Pilot geography
      - key: PILOT_LAT_CENTER
        value: "12.3051"
      - key: PILOT_LNG_CENTER
        value: "76.6551"
      # Timeouts
      - key: JOB_TIMEOUT_SECONDS
        value: "120"
      - key: MATCHING_RADIUS_KM
        value: "5"
