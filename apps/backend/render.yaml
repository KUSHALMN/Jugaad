# ============================================================================
# Jugaad Backend — Render Blueprint (render.yaml)
# ============================================================================
# Replaces: Cloud Run (13 services) + Google API Gateway
# Region: Singapore (closest to India, lowest latency)
# ============================================================================

services:
  # ─── API Gateway (reverse proxy) ──────────────────────────────────────────
  - type: web
    name: jugaad-gateway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn gateway.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    region: singapore
    plan: starter
    envVars:
      - fromGroup: jugaad-shared-env
      - key: REQUEST_SERVICE_URL
        fromService:
          name: jugaad-request-service
          type: web
          property: host
      - key: MATCHING_SERVICE_URL
        fromService:
          name: jugaad-matching-service
          type: web
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: jugaad-notification-service
          type: web
          property: host
      - key: JOB_SERVICE_URL
        fromService:
          name: jugaad-job-service
          type: web
          property: host
      - key: WORKER_SERVICE_URL
        fromService:
          name: jugaad-worker-service
          type: web
          property: host
      - key: BOOKING_SERVICE_URL
        fromService:
          name: jugaad-booking-service
          type: web
          property: host
      - key: PAYMENT_SERVICE_URL
