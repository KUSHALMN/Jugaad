          name: jugaad-user-service
          type: web
          property: host
      - key: SCHEDULER_SERVICE_URL
        fromService:
          name: jugaad-scheduler-service
          type: web
          property: host

  # ─── Request Service ──────────────────────────────────────────────────────
  - type: web
    name: jugaad-request-service
    runtime: python
    buildCommand: pip install -r requirements.txt
